<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />

    <title>Date Letter ❤️</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Aldrich&family=Pixelify+Sans:wght@400..700&display=swap"
        rel="stylesheet"
    />
</head>

<body>

    <!-- Envelope Screen -->
    <div id="envelope-container">
        <img
            src="envelope.png"
            alt="Envelope"
            id="envelope"
        />

        <p class="envelope-text">
            ♡ Letter for You ♡
        </p>
    </div>


    <!-- Letter Screen -->
    <div id="letter-container">

        <div class="letter-window">

            <h1 id="letter-title">
                Will you be my Date?
            </h1>

            <img
                src="cat_heart.gif"
                class="cat"
                id="letter-cat"
                alt="Cute cat"
            />

            <!-- YES / NO -->
            <div
                class="buttons"
                id="letter-buttons"
            >

                <img
                    src="yes.png"
                    class="btn yes-btn"
                    alt="Yes"
                />

                <div class="no-wrapper">

                    <img
                        src="no.png"
                        class="btn no-btn"
                        alt="No"
                    />

                </div>

            </div>


          <!-- Final message + date planning -->
          <div
              id="final-section"
              class="final-section"
          >

              <p id="final-text" class="final-text">
                  Yippeeee! ❤️
              </p>

              <p class="planning-text">
                  Okay, one tiny question... 💭
              </p>

              <p class="question-text">
                  Do you have any ideas for our date?
              </p>


              <!-- =========================
                  CHOICE
              ========================== -->

              <div
                  id="suggestion-choice"
                  class="suggestion-choice"
              >

                  <button
                      type="button"
                      id="idea-btn"
                      class="choice-btn"
                  >
                      💭 I have an idea!
                  </button>

                  <button
                      type="button"
                      id="surprise-btn"
                      class="choice-btn"
                  >
                      🥰 You decide!
                  </button>

              </div>


              <!-- =========================
                  IDEA FORM
              ========================== -->

              <form
                  id="date-form"
              >

                  <label for="suggestion">
                      Tell me your idea 💭
                  </label>

                  <textarea
                      id="suggestion"
                      name="suggestion"
                      placeholder="Something you'd love to do..."
                      rows="3"
                  ></textarea>


                  <label for="place">
                      Where should we go? 📍
                  </label>

                  <input
                      type="text"
                      id="place"
                      name="place"
                      placeholder="Your favourite place..."
                      required
                  />


                  <label for="date">
                      What date should we go? 📅
                  </label>

                  <input
                      type="date"
                      id="date"
                      name="date"
                      required
                  />


                  <label for="time">
                      What time works for you? 🕐
                  </label>

                  <input
                      type="time"
                      id="time"
                      name="time"
                      required
                  />


                  <button
                      type="submit"
                      id="send-date"
                  >
                      Send ❤️
                  </button>

              </form>


              <!-- =========================
                  SURPRISE OPTION
              ========================== -->

              <div
                  id="surprise-section"
                  class="surprise-section"
              >

                  <p class="surprise-title">
                      Oooo, leaving it to me? 👀❤️
                  </p>

                  <p class="surprise-text">
                      Don't worry, I'll plan something special.
                      Your only job is to show up. 😌💕
                  </p>

                  <button
                      type="button"
                      id="trust-btn"
                      class="choice-btn"
                  >
                      I'm trusting you ❤️
                  </button>

              </div>


              <!-- =========================
                  SUCCESS
              ========================== -->

              <p
                  id="form-success"
                  class="form-success"
              >
                  Perfect! It's a date! ❤️🥰
              </p>

          </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
